name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build:mcp
      - run: node --input-type=module -e "import('./src/server.js').then(({ createServer }) => { createServer(); console.log('MCP factory OK'); })"
      - run: npm test

  windows-installer:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build:mcp
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: LocalBridge-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
